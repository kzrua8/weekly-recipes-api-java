# ------------------ Common (all profiles) ------------------
spring:
  profiles:
    default: dev # pick 'dev' unless explicitly overridden
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080

# Swagger UI (springdoc) - common
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    enabled: true

# ------------------ Prod profile (PostgreSQL) ------------------
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://localhost:5432/recipes
    username: recipes
    password: ${RECIPES_DB_PASSWORD:change-me}
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: "when_authorized"

logging:
  level:
    org.springframework: info
